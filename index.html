<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AK视频传媒</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0a0a0a;
  color: white;
  overflow-x: hidden;
}

/* 背景光效 */
.bg {
  position: fixed;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at 20% 20%, #00ffe5 0%, transparent 40%),
              radial-gradient(circle at 80% 70%, #ff00ff 0%, transparent 40%);
  opacity: 0.15;
  z-index: -1;
}

/* 顶部 */
header {
  text-align: center;
  padding: 120px 20px 60px;
}

h1 {
  font-size: 60px;
  color: #00ffe5;
  text-shadow: 0 0 20px #00ffe5;
}

p {
  color: #aaa;
  margin-top: 10px;
}

/* 按钮 */
.btn {
  margin-top: 20px;
  display: inline-block;
  padding: 12px 25px;
  border: 1px solid #00ffe5;
  color: #00ffe5;
  text-decoration: none;
  transition: 0.3s;
}

.btn:hover {
  background: #00ffe5;
  color: black;
}

/* 作品区 */
.section {
  padding: 60px 10%;
}

.section h2 {
  color: #ff00ff;
  margin-bottom: 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
}

.card {
  background: #111;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid #222;
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.05);
  border-color: #00ffe5;
}

.card img {
  width: 100%;
  display: block;
}

.card p {
  padding: 10px;
  color: #ccc;
}

/* 关于 */
.about {
  text-align: center;
  padding: 80px 20px;
  color: #aaa;
}

/* 底部 */
footer {
  text-align: center;
  padding: 30px;
  border-top: 1px solid #222;
  color: #555;
}
</style>
</head>

<body>

<div class="bg"></div>

<header>
  <h1>AK视频传媒</h1>
  <p>专注短视频 · 品牌宣传 · 视觉创意制作</p>
  <a class="btn" href="#work">查看作品</a>
</header>

<section class="section" id="work">
  <h2>精选作品</h2>

  <div class="grid">
    <div class="card">
      <img src="https://picsum.photos/600/400?1">
      <p>品牌宣传片制作</p>
    </div>

    <div class="card">
      <img src="https://picsum.photos/600/400?2">
      <p>短视频创意剪辑</p>
    </div>

    <div class="card">
      <img src="https://picsum.photos/600/400?3">
      <p>广告视觉设计</p>
    </div>

    <div class="card">
      <img src="https://picsum.photos/600/400?4">
      <p>企业宣传内容</p>
    </div>
  </div>
</section>

<section class="about">
  <h2>关于我们</h2>
  <p>
    AK视频传媒致力于打造高质量视觉内容解决方案，  
    覆盖短视频、广告创意、品牌传播与影视制作。
  </p>
</section>

<footer>
  © 2026 AK Video Media. All Rights Reserved.
</footer>

</body>
</html>
